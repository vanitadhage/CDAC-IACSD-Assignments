<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div style="width: 98%; border: 2px black solid">
      <table border="1" style="width: 98%; margin: 5px">
        <tbody>
          <tr>
            <td style="width: 100px">
              <img
                src="https://cdn.dummyjson.com/product-images/beauty/essence-mascara-lash-princess/thumbnail.webp"
                alt="Essence Mascara Lash Princess"
                style="height: 100px; width: 100px"
              />
            </td>
            <td>
              <table border="1" style="width: 50%">
                <tr>
                  <td style="font-weight: bolder; width: 150px">Product ID</td>
                  <td>1</td>
                </tr>
                <tr>
                  <td style="font-weight: bolder; width: 150px">Product</td>
                  <td>Essence Mascara Lash Princess</td>
                </tr>

                <tr>
                  <td style="font-weight: bolder; width: 150px">Description</td>
                  <td>
                    <p>
                      The Essence Mascara Lash Princess is a popular mascara
                      known for its volumizing and lengthening effects. Achieve
                      dramatic lashes with this long-lasting and cruelty-free
                      formula.
                    </p>
                  </td>
                </tr>
                <tr>
                  <td style="font-weight: bolder; width: 150px">Price</td>
                  <td>9.99</td>
                </tr>

                <tr>
                  <td style="font-weight: bolder; width: 150px">Rating</td>
                  <td>2.56</td>
                </tr>
              </table>
            </td>
            <td style="padding: 10px">
              <input
                type="button"
                id="btnAdd"
                value="Add To Cart"
                onclick="AddToCart(1, 'Essence Mascara Lash Princess', 9.99)"
              />
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <hr />

    <script>
      var productPurchased = [];

      function AddToCart(productId, productName, productPrice) {
        console.log(
          `Product ID = ${productId}, Product Name = ${productName}, Product Price = ${productPrice}`,
        );

        productPurchased.push({
          ID: productId,
          Title: productName,
          Price: productPrice,
        });
      }

      function Show() {
        console.log(productPurchased);
      }
    </script>
  </body>
</html>
