<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/common.css">
  </head>
  <body>
    <div
      id="container"
     class="Container"
    >
      <img
        src="images/logo.png"
        class="Logo"
        alt="iacsd shopping mall"
      />
      <hr />
      <a href="shopping.html">Go shopping</a> | &nbsp;&nbsp;
      <a href="billing.html">Billing</a> | &nbsp;&nbsp;
      <a href="about.html">About Us</a> | &nbsp;&nbsp;
      <hr />
      <div
        id="adDiv"
        class="AdContainer"
      >
        <img src="#"  class="AdImage" alt="Advertisement" />
      </div>
    
      <hr />
      <input type="button" value="Check out" id="btnCheckOut" onclick="Checkout()"
              />
      <hr />
      <div
        id="pageContentPlaceHolder"
        class="ContentPlaceHolder">
      </div>
      
      </div>
      <hr />
      <center>
        <h4> developed by iacsd. 2026</h4>

        <a href="linkedin.com">
            <img src="images/linkedin.png" alt="linkedIn Page Link" class="SocialMediaIcon">
        </a>

        &nbsp;
        
        <a href="facebook.com">
            <img src="images/fb.png" alt="facebook Page Link" 
            class="SocialMediaIcon">
        </a>

        &nbsp; 
        
         <a href="instagram.com">
            <img src="images/insta.png" alt="Instagram Page Link" class="SocialMediaIcon">
        </a>

       </center>
      <hr />
    </div>
    <script>

      var helper = new XMLHttpRequest();

      function GetProducts()
      {
        helper.onreadystatechange = UponReadyStateChange;
        helper.open("GET", "https://dummyjson.com/products");
        helper.send();
      }

      function UponReadyStateChange()
      {
          if(helper.readyState == 4 && helper.status == 200)
          {
            var responseFromServer = JSON.parse(helper.responseText);
            var products = responseFromServer.products;

            var refTopageContentPlaceHolder = document.getElementById("pageContentPlaceHolder");

            for(i=0; i<products.length; i++)
            {
              var product = products[i];
              var productUI = `<div style="width: 98%; border: 2px black solid">
      <table border="1" style="width: 98%; margin: 5px">
        <tbody>
          <tr>
            <td style="width: 100px">
              <img
                src="${product.thumbnail}"
                alt="${product.title}"
                style="height: 100px; width: 100px"
              />
            </td>
            <td>
              <table border="1" style="width: 50%">
                <tr>
                  <td style="font-weight: bolder; width: 150px">Product ID</td>
                  <td>${product.id}</td>
                </tr>
                <tr>
                  <td style="font-weight: bolder; width: 150px">Product</td>
                  <td>${product.title}</td>
                </tr>

                <tr>
                  <td style="font-weight: bolder; width: 150px">Description</td>
                  <td>
                    <p>
                     ${product.description}
                    </p>
                  </td>
                </tr>
                <tr>
                  <td style="font-weight: bolder; width: 150px">Price</td>
                  <td>${product.price}</td>
                </tr>

                <tr>
                  <td style="font-weight: bolder; width: 150px">Rating</td>
                  <td>${product.rating}</td>
                </tr>
              </table>
            </td>
            <td style="padding: 10px">
              <input
                type="button"
                id="btnAdd"
                value="Add To Cart"
                onclick="AddToCart(${product.id}, '${product.title}', ${product.price})"
              />
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <hr />`;
              refTopageContentPlaceHolder.innerHTML = 
                  refTopageContentPlaceHolder.innerHTML  + productUI;
            }
          }
      }


      var productPurchased = [];

      function AddToCart(productId, productName, productPrice) {
        console.log(
          `Product ID = ${productId}, Product Name = ${productName}, Product Price = ${productPrice}`,
        );

        productPurchased.push({
          ID: productId,
          Title: productName,
          Price: productPrice,
        });
      }


      function Checkout()
      {
        if(productPurchased.length > 0)
         {
            console.log(productPurchased);
            localStorage.setItem("productPurchased", JSON.stringify(productPurchased));
            window.location.href = "billing.html";
          }
        else
          {
           alert("Kuch toh purchase kar!")
          }
      }

      GetProducts();

    </script>
  </body>
</html>
